name: Run tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Force clean install (fix Rollup bug)
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --include=optional

      - name: Build
        run: npm run build

  
